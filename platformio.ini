; Orbit Station: OrbIt firmware for an ESP32-S3 (N16R8) driving five GC9A01
; round screens. See PLAN.md.

[env:s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB quad flash, 8MB octal PSRAM. default_16MB has two app slots
; (for updates over WiFi) and a data partition for LittleFS.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Serial goes out the board's native USB-C socket (labelled USB).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DORBIT_STATION_VERSION=\"0.0.1\"

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.0.4

; Built into the firmware. Fonts are TrueType, drawn with OpenFontRender
; (lib/, the same copy info-orbs uses). zones.csv maps timezone names to the
; rules the ESP32's clock needs (from the posix_tz_db project, MIT licence).
board_build.embed_files =
    fonts/RobotoRegular.ttf
    images/weather/cloudsB.jpg
    images/weather/moonB.jpg
    images/weather/moonCloudB.jpg
    images/weather/rainB.jpg
    images/weather/snowB.jpg
    images/weather/sunB.jpg
    images/weather/sunCloudsB.jpg
board_build.embed_txtfiles =
    assets/zones.csv

; Update over WiFi once the board is online. Use the name its first screen
; shows, or its address:
;   pio run -e s3-ota -t upload --upload-port orbit-station-xx.local
[env:s3-ota]
extends = env:s3
upload_protocol = espota
; The board connects back to the PC on this port to fetch the firmware, so
; the PC's firewall must allow incoming TCP connections on it.
upload_flags = --host_port=47269
