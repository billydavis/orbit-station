<svg xmlns="http://www.w3.org/2000/svg" width="980" height="900" viewBox="0 0 980 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Orbit Station breadboard wiring</title>
<desc>An ESP32-S3 N16R8 board drives five GC9A01 round screens. SCLK, MOSI, DC and RST are shared by all five screens; each screen has its own CS line. The screens are powered from an AMS1117 3.3 V module fed from the board's 5 V pin; the board's own 3V3 pin is not connected.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E67E22"/></marker></defs>
<rect width="980" height="900" fill="#FFFFFF"/>
<text x="40" y="38" font-size="13" fill="#333">5 V USB-C supply (2 A or more) into the board's USB socket: power and data</text>
<line x1="100" y1="46" x2="100" y2="78" stroke="#E67E22" stroke-width="2.5" marker-end="url(#arrow)"/>
